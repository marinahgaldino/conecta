  async function parseTextOnly(promptText, maxTokens, apiKey) {
    let response;
    try {
      const headers = { "Content-Type": "application/json" };
      if (apiKey) {
        headers["x-api-key"] = apiKey;
        headers["anthropic-version"] = "2023-06-01";
        headers["anthropic-dangerous-direct-browser-access"] = "true";
      }
      response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers,
        body: JSON.stringify({
          model: "claude-sonnet-5",
          max_tokens: maxTokens || 1e3,
          messages: [{ role: "user", content: promptText }]
        })
      });
    } catch (networkErr) {
      console.error("Erro de rede ao interpretar dados colados:", networkErr);
      throw new Error("N\xE3o consegui conectar para interpretar o texto colado.");
    }
    if (!response.ok) {
      let bodyText = "";
      try {
        bodyText = await response.text();
      } catch (e) {
      }
      console.error("Resposta n\xE3o OK ao interpretar dados:", response.status, bodyText);
      let detail = "";
      try {
        const parsedBody = JSON.parse(bodyText);
        detail = parsedBody && parsedBody.error && parsedBody.error.message ? parsedBody.error.message : "";
      } catch (e) {
      }
      throw new Error("Falha ao interpretar o texto (c\xF3digo " + response.status + ")" + (detail ? ": " + detail : "") + ".");
    }
    const data = await response.json();
    const text = (data.content || []).filter((block) => block.type === "text").map((block) => block.text).join("\n").trim();
    const clean = text.replace(/```json/gi, "").replace(/```/g, "").trim();
    try {
      return JSON.parse(clean);
    } catch (parseErr) {
      const inicio = clean.indexOf("{");
      if (inicio !== -1) {
        let profundidade = 0;
        for (let i = inicio; i < clean.length; i++) {
          if (clean[i] === "{") profundidade++;
          else if (clean[i] === "}") {
            profundidade--;
            if (profundidade === 0) {
              try {
                return JSON.parse(clean.slice(inicio, i + 1));
              } catch (e) {
              }
              break;
            }
          }
        }
      }
      console.error("Falha ao interpretar JSON de campos colados:", parseErr, clean);

    }

  // Acha o primeiro JSON balanceado no texto (conta chaves/colchetes de
  // verdade, em vez de "primeiro delimitador at\xE9 o \xFAltimo" como antes \u2014
  // isso evita pegar lixo do meio quando h\xE1 texto extra antes/depois do
  // JSON real, e detecta truncamento de forma confi\xE1vel (retorna null).
  function extrairJsonBalanceadoGenerico(texto) {
    const candidatos = [];
    for (const [abre, fecha] of [["{", "}"], ["[", "]"]]) {
      const inicio = texto.indexOf(abre);
      if (inicio === -1) continue;
      let profundidade = 0;
      for (let i = inicio; i < texto.length; i++) {
        if (texto[i] === abre) profundidade++;
        else if (texto[i] === fecha) {
          profundidade--;
          if (profundidade === 0) {
            candidatos.push(texto.slice(inicio, i + 1));
            break;
          }
        }
      }
    }
    if (candidatos.length === 0) return null;
    // se achou os dois (objeto e lista), fica com o mais longo (mais completo)
    return candidatos.reduce((a, b) => b.length > a.length ? b : a);
  }
